# Nginx Configuration for training.thelabindonesia.my.id
# Place in: /etc/nginx/sites-available/training.thelabindonesia.my.id
# Enable with: sudo ln -s /etc/nginx/sites-available/training.thelabindonesia.my.id /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name training.thelabindonesia.my.id;

    # Redirect HTTP to HTTPS (Certbot will manage this automatically after running certbot)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional static asset caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
